# Copy to config.yaml and run:  python -m optionsbot --config config.yaml
# Every key is optional; omitted keys use the defaults in optionsbot/config.py.

symbols: [NIFTY, BANKNIFTY]        # stock options also work, e.g. RELIANCE (add its lot size below)
lot_sizes:                         # NSE revises these; check the latest circular
  NIFTY: 65
  BANKNIFTY: 30
  FINNIFTY: 60
  MIDCPNIFTY: 120
  # RELIANCE: 500
auto_paper_trade: true             # false = recommend only; paper-trade from the dashboard button
db_path: data/paper_trades.db

data:
  provider: nse                    # nse (live public data) | simulated
  poll_seconds: 60                 # NSE throttles; don't go below ~30
  stale_after_seconds: 300

risk:                              # the loss-minimisation controls
  capital: 500000                  # INR
  risk_per_trade_pct: 1.0          # worst-case loss of any one trade
  max_portfolio_risk_pct: 5.0      # sum of worst-case losses across open trades
  max_daily_loss_pct: 2.0          # realised + unrealised; trips the circuit breaker
  flatten_on_daily_loss: true
  max_consecutive_losses: 3
  max_open_positions: 3
  max_lots_per_trade: 10

exits:
  credit_take_profit_pct: 50       # take 50% of max profit on credit spreads
  credit_stop_loss_multiple: 1.0   # stop when the loss equals the credit received
  debit_take_profit_pct: 60
  debit_stop_loss_pct: 50
  short_delta_exit: 0.45           # exit when a short strike gets tested
  expiry_day_exit_time: "14:45"

strategy:
  min_dte: 2
  max_dte: 35
  min_confidence: 0.55
  min_ev_per_risk: 0.03
  entry_start: "09:30"
  entry_end: "14:30"
  event_days: []                   # e.g. ["2026-12-05"] for RBI policy, budget, election results

costs:                             # verify against your broker
  brokerage_per_order: 20
  stt_sell_pct: 0.15
  exchange_txn_pct: 0.03503
